name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fast-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Alchemy's dependencies
        run: python -m pip install '.[test]'
      - name: Lint and check formatting
        run: |
          # Pinned: an unpinned Ruff would reformat the tree on any release
          # that changes its style, turning an upstream update into a CI
          # failure on unrelated pull requests.
          python -m pip install 'ruff==0.16.1'
          ruff check src tests tools
          ruff format --check src tests tools
      - name: Type-check
        run: |
          # Pinned for the same reason as Ruff above: a new mypy release adds
          # checks, and an unpinned one turns an upstream update into a CI
          # failure on unrelated pull requests.
          python -m pip install 'mypy==1.19.1'
          # Mypy's own defaults, deliberately: no strictness flags, no
          # [tool.mypy] section. See the note in pyproject.toml for what that
          # does and does not cover.
          mypy src tools
      - name: Run the fast offline suite
        run: |
          python -m pytest --no-ccp4 --no-network --skip-slow \
            --cov=src --cov-report=term-missing --cov-fail-under=86

  windows-offline:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Alchemy's dependencies
        run: python -m pip install '.[test]'
      - name: Run the Windows offline suite
        run: python -m pytest --no-ccp4 --no-network --skip-slow

  macos-offline:
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Alchemy's dependencies
        run: python -m pip install '.[test]'
      - name: Run the macOS offline suite
        run: python -m pytest --no-ccp4 --no-network --skip-slow
