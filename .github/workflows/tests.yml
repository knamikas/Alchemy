name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fast-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Alchemy and its test dependency
        run: python -m pip install -e '.[test]'
      - name: Run the fast offline suite
        run: python -m pytest --no-ccp4 --no-network --skip-slow
