name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fast-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Alchemy's dependencies
        run: python -m pip install '.[test]'
      - name: Lint and check formatting
        run: |
          # Pinned: an unpinned Ruff would reformat the tree on any release
          # that changes its style, turning an upstream update into a CI
          # failure on unrelated pull requests.
          python -m pip install 'ruff==0.16.1'
          ruff check src tests tools
          ruff format --check src tests tools
      - name: Run the fast offline suite
        run: |
          python -m pytest --no-ccp4 --no-network --skip-slow \
            --cov=src --cov-report=term-missing --cov-fail-under=75
