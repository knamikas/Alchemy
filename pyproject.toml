[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "alchemy"
dynamic = ["version"]
description = "PDB-wide crystallographic validation of modeled metal sites"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gemmi>=0.7.0",
    "numpy>=1.17",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

# Alchemy is run from a clone (`python src/main.py`), never imported as a
# library, so it deliberately ships no importable modules. Declaring both lists
# empty keeps `pip install .` a dependency-only operation: it records the
# distribution metadata that resolves gemmi and numpy, and installs nothing
# else. Left to auto-discovery, setuptools would instead publish `main`, `data`
# and six other generic top-level names into site-packages, where they would
# shadow or be shadowed by unrelated projects.
[tool.setuptools]
packages = []
py-modules = []
# Needed so the dynamic version below can resolve `_version` under src/. It
# does not re-enable discovery: packages and py-modules stay empty.
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "_version.__version__"}

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
# Coverage is measured but not enforced by default, so a plain
# `pytest` run stays fast. CI adds:
#   --cov=src --cov-report=term-missing --cov-fail-under=86
# The floor is set just under the measured figure so it ratchets rather than
# trips; left far below it, a change could delete hundreds of covered
# statements unnoticed. Last measured at 88% (4905 statements, 608 missed) on
# the lane CI runs:
#   pytest --no-ccp4 --no-network --skip-slow --cov=src
# Re-run that before moving the floor, and keep it in step with
# .github/workflows/tests.yml, which is where the number takes effect. The gap
# is concentrated in driver/resources (62%), inputs.py (65%), ccp4_setup (67%)
# and driver/pool (76%): mostly error and interrupt paths that need a real
# subprocess or a killed worker to reach, plus the Windows and sysconf memory
# fallbacks, which no Linux run can execute.
markers = [
    "ccp4: requires the CCP4 binaries (mtzfix, fft, mapmask, edstats) on PATH",
    "entry_data: requires the checksum-pinned PDB-REDO integration entries",
    "network: may contact pdb-redo.eu for a live check or missing entry data",
    "slow: end-to-end pipeline run; skip with --skip-slow or deselect with -m 'not slow'",
]
filterwarnings = [
    "error::pytest.PytestUnknownMarkWarning",
]

# Line length 88 rather than 79: at the time this was adopted 19 lines exceeded
# 88 against 571 exceeding 79, so 88 was much the closer fit to how the code was
# already written.
#
# The tree is `ruff format`-formatted, and CI enforces that with
# `ruff format --check` alongside `ruff check`. Keep the CI pin in
# .github/workflows/tests.yml in step with whatever version you format with
# locally: Ruff's style can change between releases, so an unpinned version
# would reformat the tree and fail unrelated pull requests.
[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# Deliberately narrow. E/W/F/B catch real defects -- undefined names, unused
# bindings, exception-handling mistakes -- and the tree is clean under them.
# Modernization rules (UP) are excluded on purpose: `ruff check --select UP
# src tests tools` reports 347 findings, 334 of them annotation rewrites,
# which belong with the typing work rather than a lint gate.
select = ["E", "W", "F", "B"]
ignore = [
    # zip(..., strict=) changes behaviour: length mismatches would begin
    # raising where they are currently truncated silently. Several zips here
    # pair records that are length-checked immediately beforehand, so this
    # wants a deliberate audit rather than a sweep.
    "B905",
]
