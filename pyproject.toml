[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "alchemy"
version = "1.0.0"
description = "PDB-wide crystallographic validation of modeled metal sites"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "gemmi>=0.7.0",
    "numpy>=1.17",
]

[tool.setuptools.package-data]
data = [
    "*.txt",
    "*.json",
]
