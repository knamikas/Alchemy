[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "alchemy"
dynamic = ["version"]
description = "Crystallographic validation of modeled metal sites"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
    "gemmi>=0.7.0",
    "numpy>=1.17",
    "typing_extensions>=4.6",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    # The wheel-metadata test builds a wheel without build isolation.
    "setuptools>=61",
    "wheel",
]
# Pinned so local lint and type checks agree with CI; bump both deliberately.
dev = [
    "ruff==0.16.1",
    "mypy==1.19.1",
]

# Install dependencies and distribution metadata only. Disable module discovery
# so generic source names such as main cannot shadow unrelated packages.
[tool.setuptools]
packages = []
py-modules = []
# Resolve the version from src without enabling package discovery.
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "_version.__version__"}

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
# CI enforces 86% coverage on the offline suite; plain pytest does not collect it.
# Measure that suite before changing the floor in .github/workflows/tests.yml.
markers = [
    "ccp4: requires the CCP4 binaries (mtzfix, fft, mapmask, edstats) on PATH",
    "entry_data: requires the checksum-pinned PDB-REDO integration entries",
    "network: may contact pdb-redo.eu for a live check or missing entry data",
    "slow: end-to-end pipeline run; skip with --skip-slow or deselect with -m 'not slow'",
]
filterwarnings = [
    "error::pytest.PytestUnknownMarkWarning",
]

# Use the Ruff version pinned in the dev extra to keep formatting consistent.
[tool.ruff]
line-length = 88
# The launcher has no .py extension, so name it explicitly.
extend-include = ["alchemy"]
target-version = "py311"

[tool.ruff.lint]
# Keep enabled rules aligned with the Python style guide.
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "PIE", "N", "D"]
ignore = [
    # Formatting and long-line judgment are handled by Ruff's formatter.
    "E501",
    # Some resources intentionally outlive the scope in which they are opened.
    "SIM115",
    # Preserve the established serialized values and behavior of string enums.
    "UP042",
]

[tool.ruff.lint.isort]
# Keep aliased names in the same import statement as the rest of their module.
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D1"]

[tool.mypy]
# Use the running interpreter's Python version to match installed dependency stubs.
# Mirror the runtime search path for source and test modules.
mypy_path = ["src", "tests"]
strict = true
warn_unreachable = true
# Enable optional checks supported by the pinned mypy version.
enable_error_code = [
    "deprecated",
    "exhaustive-match",
    "explicit-override",
    "ignore-without-code",
    "mutable-override",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "unimported-reveal",
    "unused-awaitable",
    "unused-ignore",
]

# Allow explicit Any for heterogeneous CSV rows without inventing unchecked shapes.
