[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "metal-alchemy"
version = "0.1.0"
description = "PDB-wide crystallographic validation of modeled metal sites"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "gemmi>=0.7.0",
    "requests",
]

[project.optional-dependencies]
test = [
    "pytest>=7",
    "tomli>=2; python_version < '3.11'",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
